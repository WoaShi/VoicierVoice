name: Build and Release Windows Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            run_selftest: true
          - rid: win-arm64
            run_selftest: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $clean = $tag.TrimStart('v')
          if ($clean -notmatch '^\d+\.\d+\.\d+') { $clean = '1.0.0' }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$clean"

      - name: Publish self-contained (${{ matrix.rid }})
        shell: pwsh
        run: |
          $outDir = "dist/VoicierVoice-$env:RELEASE_TAG-${{ matrix.rid }}"
          dotnet publish VoicierVoice.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:Version=$env:RELEASE_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $outDir
          Get-ChildItem -Path $outDir -File | Where-Object {
            $_.Extension -in '.lib', '.pdb' -or $_.Name -like 'onnxruntime_providers_tensorrt*'
          } | Remove-Item -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "dist/VoicierVoice-$env:RELEASE_TAG-${{ matrix.rid }}.zip" -CompressionLevel Optimal

      - name: Verify win-x64 manifest and smoke paths
        if: matrix.run_selftest
        shell: pwsh
        run: |
          $exe = "dist/VoicierVoice-$env:RELEASE_TAG-${{ matrix.rid }}/VoicierVoice.exe"
          Test-Path $exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicierVoice-${{ matrix.rid }}
          path: dist/VoicierVoice-*.zip

  publish-release:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout tag metadata
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: .gitignore
          sparse-checkout-cone-mode: false

      - name: Resolve release tag and notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force 2>$null
          $tagBody = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          $bodyPath = Join-Path $env:RUNNER_TEMP "release_body.md"
          [System.IO.File]::WriteAllText($bodyPath, $tagBody, [System.Text.UTF8Encoding]::new($false))
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_BODY_PATH=$bodyPath"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -Path artifacts -Filter "*.zip" | Sort-Object Name)
          if ($zips.Count -lt 2) {
            throw "Expected at least 2 release zip files in artifacts/, found $($zips.Count)."
          }
          $lines = $zips | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VoicierVoice ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
